# Community OS — Cloudflare Workers Free Deployment Configuration
# Runs 100% on Cloudflare Workers Free without any paid add-ons or hidden tiers.

name = "community-os"
main = "cloudflare/worker.ts"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".next/static"
binding = "ASSETS"

# Public non-sensitive environment variables
[vars]
NODE_ENV = "production"
APP_URL = "https://community-os.workers.dev"
TELEGRAM_BOT_USERNAME = "CommunityOutcomeBot"
DISCORD_APPLICATION_ID = "1347000000000000000"
WHOP_PRO_PRODUCT_ID = "prod_community_pro_15"
NEXT_PUBLIC_WHOP_CHECKOUT_URL = "https://whop.com/baha-1a44/community-os-pro"

# SECRETS CONFIGURATION INSTRUCTIONS:
# Encrypted Cloudflare Secrets must be configured via Wrangler CLI:
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   npx wrangler secret put DISCORD_BOT_TOKEN
#   npx wrangler secret put DISCORD_PUBLIC_KEY
#   npx wrangler secret put WHOP_API_KEY
#   npx wrangler secret put WHOP_WEBHOOK_SECRET
#   npx wrangler secret put SESSION_SECRET
